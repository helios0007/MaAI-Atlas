<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas icon pack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code&display=swap" />
<style>
  body { margin: 0; padding: 32px 16px; background: #0a0c11; color: #eef0f4; font: 13px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { color: #8790a0; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 8px 12px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; background: rgba(255,255,255,.03); }
  .cell svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .cell:hover { color: #e9c46a; border-color: rgba(233,196,106,.4); }
  code { font: 11px 'Fira Code', monospace; color: #8790a0; }
</style>
</head>
<body><main>
<h1>MaAI Atlas icon pack</h1>
<p>Original icons for the Atlas. 24 × 24 grid, 1.6 stroke, colour from <code>currentColor</code>. Use: <code>&lt;svg class="ic"&gt;&lt;use href="assets/icons/atlas-icons.svg#i-map"/&gt;&lt;/svg&gt;</code></p>
<div class="grid" id="grid"></div>
</main>
<script>
fetch('atlas-icons.svg').then(r => r.text()).then(t => {
  const ids = [...t.matchAll(/<symbol id="([^"]+)"/g)].map(m => m[1]);
  document.getElementById('grid').innerHTML = ids.map(id =>
    `<div class="cell"><svg><use href="atlas-icons.svg#${id}"/></svg><code>${id}</code></div>`).join('');
});
</script>
</body></html>
